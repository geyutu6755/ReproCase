name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        # --with-deps installs system libraries; only ubuntu needs it.
        run: npx playwright install ${{ matrix.os == 'ubuntu-latest' && '--with-deps' || '' }} chromium

      - name: Build
        run: npm run build

      - name: Unit + integration + e2e tests
        run: npm run test:all

      - name: Generate demo report (Node 22 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node dist/cli.js demo --out demo-report --no-open -q

      # Traces record raw network traffic (incl. unredacted URLs) — private
      # evidence, never uploaded. Screenshots of the public demo site stay.
      - name: Strip private evidence (Node 22 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: rm -rf demo-report/artifacts/traces
        shell: bash

      - name: Upload demo report artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: demo-report/
          retention-days: 14
