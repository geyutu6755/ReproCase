name: 'ReproCase scan'
description: >
  Run a ReproCase website scan inside this job (same runner, so localhost test
  servers work), publish a privacy-stripped report artifact and a workflow
  summary, and optionally gate on new findings by comparing against a
  committed baseline result.json.
branding:
  icon: 'search'
  color: 'blue'

inputs:
  url:
    description: 'Entry URL to scan (e.g. http://localhost:3000/ — start your site in an earlier step).'
    required: true
  reprocase-ref:
    description: 'ReproCase version to install: a tag (v0.5.1), a branch (main), or a full commit SHA. Defaults to the ref this action was pinned to.'
    required: false
    default: ''
  config:
    description: 'Optional path to a reprocase.config.json in your repository (overrides URL budgets).'
    required: false
    default: ''
  compare-with:
    description: 'Optional path to a baseline result.json (from a previous scan artifact or a committed file). Enables new/resolved/persistent diffing.'
    required: false
    default: ''
  fail-on:
    description: 'Exit 1 when "verified" or "suspected" findings exist, or "never" (report only). Does NOT affect the baseline gate — see fail-on-new.'
    required: false
    default: 'verified'
  fail-on-new:
    description: 'When compare-with is set: "true" (default) fails the action if new findings exist vs baseline; "false" reports the diff but does not gate on new findings.'
    required: false
    default: 'true'
  max-pages:
    description: 'Maximum pages to visit (scan budget).'
    required: false
    default: ''
  detection-window-ms:
    description: 'Async observation window in ms (higher = catches later hydration faults, slower scan).'
    required: false
    default: ''
  report-name:
    description: 'Artifact name for the report bundle.'
    required: false
    default: 'reprocase-report'
  node-version:
    description: 'Node.js version to run ReproCase with.'
    required: false
    default: '22'

outputs:
  verdict:
    description: 'clean (exit 0) | findings (exit 1) | error (exit 2)'
    value: ${{ steps.scan.outputs.verdict }}
  exit-code:
    description: 'Final action exit code (0/1/2).'
    value: ${{ steps.decision.outputs.exit-code }}
  scan-exit-code:
    description: 'Raw scanner exit code before gating.'
    value: ${{ steps.scan.outputs.scan-exit-code }}
  new-findings:
    description: 'Number of new findings vs the baseline (empty when no baseline was given).'
    value: ${{ steps.gate.outputs.new-findings }}
  reprocase-commit:
    description: 'Commit SHA of the installed ReproCase version.'
    value: ${{ steps.install.outputs.reprocase-commit }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install ReproCase
      id: install
      shell: bash
      env:
        REPROCASE_REF: ${{ inputs.reprocase-ref }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        # ── Ref normalisation ────────────────────────────────────────────────
        # GitHub may provide any of these formats for action_ref or user input:
        #   refs/tags/v0.5.1, refs/heads/main, v0.5.1, main, <40-char SHA>
        # We must normalise to what git clone --branch / git checkout accepts.
        REF="${REPROCASE_REF:-$ACTION_REF}"
        # Trim whitespace and reject empty after trim.
        REF=$(echo "$REF" | tr -d '[:space:]')
        if [ -z "$REF" ]; then
          echo "::error::reprocase-ref is empty. Set it to a tag (e.g. v0.5.1), branch (e.g. main), or full commit SHA."
          exit 1
        fi
        # Security: reject refs containing shell metacharacters or path traversal.
        if echo "$REF" | grep -qP '[;&|`$(){}!\[\]<>\\]'; then
          echo "::error::reprocase-ref contains unsafe characters: '$REF'. Use a plain tag, branch name, or commit SHA."
          exit 1
        fi
        if echo "$REF" | grep -q '\.\.'; then
          echo "::error::reprocase-ref contains path traversal ('..'): '$REF'."
          exit 1
        fi
        # Normalise known GitHub ref formats to bare tag/branch names.
        case "$REF" in
          refs/tags/*)   REF="${REF#refs/tags/}" ;;
          refs/heads/*)  REF="${REF#refs/heads/}" ;;
          refs/*)        REF="${REF#refs/}" ;;
        esac
        # If still empty after normalisation, use a known-good default.
        if [ -z "$REF" ]; then REF="v0.5.1"; fi
        # If it's a 40-char hex string, treat it as a SHA.
        IS_SHA=false
        if echo "$REF" | grep -qP '^[0-9a-f]{40}$'; then IS_SHA=true; fi
        # ── Clone & checkout ─────────────────────────────────────────────────
        SRC="${RUNNER_TEMP}/reprocase-src"
        rm -rf "$SRC"
        echo "Installing ReproCase from github.com/geyutu6755/ReproCase (ref: $REF, SHA mode: $IS_SHA)"
        if [ "$IS_SHA" = "true" ]; then
          # SHA refs require a full clone (cannot use --branch).
          if ! git clone https://github.com/geyutu6755/ReproCase.git "$SRC" 2>/dev/null; then
            echo "::error::Failed to clone geyutu6755/ReproCase for SHA checkout."
            exit 1
          fi
          cd "$SRC"
          if ! git cat-file -e "$REF^{commit}" 2>/dev/null; then
            echo "::error::Commit SHA '$REF' not found in geyutu6755/ReproCase."
            exit 1
          fi
          git checkout "$REF"
        else
          # Tag or branch: shallow clone with --branch.
          if git clone --depth 1 --branch "$REF" https://github.com/geyutu6755/ReproCase.git "$SRC" 2>/dev/null; then
            echo "Cloned tag/branch: $REF"
          else
            echo "::error::ReproCase ref '$REF' not found as a tag or branch in geyutu6755/ReproCase. Available tags: https://github.com/geyutu6755/ReproCase/tags"
            exit 1
          fi
        fi
        cd "$SRC"
        ACTUAL=$(git rev-parse HEAD)
        echo "reprocase-commit=$ACTUAL" >> "$GITHUB_OUTPUT"
        echo "reprocase-ref-resolved=$REF" >> "$GITHUB_OUTPUT"
        echo "Checked out commit: $ACTUAL (requested ref: $REF)"
        # Verify the checkout matches the requested ref (for tags, the tag
        # may point to an annotated commit; for SHAs, it must match exactly).
        if [ "$IS_SHA" = "true" ] && [ "$ACTUAL" != "$REF" ]; then
          echo "::error::Checked out commit $ACTUAL does not match requested SHA $REF."
          exit 1
        fi
        # ── Build & install ──────────────────────────────────────────────────
        npm ci --no-fund --no-audit
        npm run build
        npm install -g --no-fund --no-audit .
        INSTALLED_VERSION=$(reprocase --version)
        echo "reprocase-version=$INSTALLED_VERSION" >> "$GITHUB_OUTPUT"
        echo "Installed ReproCase v$INSTALLED_VERSION (commit $ACTUAL)"

    - name: Install Chromium
      shell: bash
      run: |
        set -euo pipefail
        npx playwright install chromium

    - name: Run scan
      id: scan
      shell: bash
      env:
        URL: ${{ inputs.url }}
        CONFIG: ${{ inputs.config }}
        FAIL_ON: ${{ inputs.fail-on }}
        MAX_PAGES: ${{ inputs.max-pages }}
        DETECTION_WINDOW_MS: ${{ inputs.detection-window-ms }}
      run: |
        set -uo pipefail
        ARGS=(scan --url "$URL" --out reprocase-report --fail-on "$FAIL_ON" --no-traces)
        [ -n "$CONFIG" ] && ARGS+=(--config "$CONFIG")
        [ -n "$MAX_PAGES" ] && ARGS+=(--max-pages "$MAX_PAGES")
        [ -n "$DETECTION_WINDOW_MS" ] && ARGS+=(--detection-window-ms "$DETECTION_WINDOW_MS")
        set +e
        reprocase "${ARGS[@]}"
        CODE=$?
        set -e
        echo "scan-exit-code=$CODE" >> "$GITHUB_OUTPUT"
        case "$CODE" in
          0)
            echo "verdict=clean" >> "$GITHUB_OUTPUT"
            echo "ReproCase: scan completed with no findings at or above the threshold."
            ;;
          1)
            echo "verdict=findings" >> "$GITHUB_OUTPUT"
            echo "ReproCase: scan completed — findings exist at or above the threshold."
            ;;
          2)
            echo "verdict=error" >> "$GITHUB_OUTPUT"
            echo "::error::ReproCase could not run properly (exit 2). This is an environment or configuration problem, NOT a verdict about your website. See the log above; 'reprocase doctor' diagnoses most causes."
            exit 2
            ;;
          *)
            echo "verdict=error" >> "$GITHUB_OUTPUT"
            echo "::error::ReproCase exited unexpectedly (code $CODE)."
            exit 1
            ;;
        esac

    - name: Compare with baseline (new-fault gate)
      id: gate
      if: ${{ inputs.compare-with != '' && steps.scan.outputs.verdict != 'error' }}
      shell: bash
      env:
        BASELINE: ${{ inputs.compare-with }}
        FAIL_ON_NEW_RAW: ${{ inputs.fail-on-new }}
      run: |
        set -uo pipefail
        FAIL_ON_NEW=$(echo "$FAIL_ON_NEW_RAW" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
        case "$FAIL_ON_NEW" in
          true|'')  GATE_FLAG="--fail-on new" ;;
          false)    GATE_FLAG="" ;;
          *)
            echo "::error::Invalid fail-on-new value '$FAIL_ON_NEW_RAW'. Use 'true' or 'false'."
            exit 1
            ;;
        esac
        echo "fail-on-new-normalised=$FAIL_ON_NEW" >> "$GITHUB_OUTPUT"
        if [ ! -f "$BASELINE" ]; then
          echo "::notice::Baseline '$BASELINE' not found — first run on this branch? Skipping the new-findings gate; this scan becomes the new baseline candidate."
          echo "new-findings=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ ! -f reprocase-report/result.json ]; then
          echo "::error::Scan produced no result.json — the scan may have failed before writing results. Cannot compare."
          exit 1
        fi
        GATE_ARGS=(compare "$BASELINE" reprocase-report/result.json --out reprocase-report/compare)
        [ -n "$GATE_FLAG" ] && GATE_ARGS+=("$GATE_FLAG")
        set +e
        reprocase "${GATE_ARGS[@]}"
        CODE=$?
        set -e
        NEW=$(node -e "const r=require('./reprocase-report/compare/compare.json');console.log(r.summary.newCount)" 2>/dev/null || echo 0)
        echo "new-findings=$NEW" >> "$GITHUB_OUTPUT"
        case "$CODE" in
          0) echo "ReproCase compare: no new findings (gate passed)." ;;
          1)
            if [ "$FAIL_ON_NEW" = "true" ]; then
              echo "::error::ReproCase compare: $NEW new finding(s) vs baseline. Gate: FAIL (fail-on-new=true)."
              exit 1
            else
              echo "::warning::ReproCase compare: $NEW new finding(s) vs baseline. Gate: PASS (fail-on-new=false — report only)."
            fi ;;
          2)
            echo "::error::ReproCase compare failed to run (bad baseline file?). Fix the baseline or remove compare-with."
            exit 1 ;;
        esac

    - name: Final CI decision
      id: decision
      if: ${{ always() }}
      shell: bash
      env:
        SCAN_VERDICT: ${{ steps.scan.outputs.verdict }}
        SCAN_EXIT: ${{ steps.scan.outputs.scan-exit-code }}
        GATE_CONCLUSION: ${{ steps.gate.conclusion }}
        INSTALL_CONCLUSION: ${{ steps.install.conclusion }}
        HAS_COMPARE: ${{ inputs.compare-with != '' }}
      run: |
        set -uo pipefail
        NEW="${{ steps.gate.outputs.new-findings }}"
        echo "new-findings=$NEW" >> "$GITHUB_OUTPUT"

        # Priority 1: installation or scan environment error (exit 2).
        if [ "$INSTALL_CONCLUSION" = "failure" ] || [ "$SCAN_VERDICT" = "error" ]; then
          echo "exit-code=2" >> "$GITHUB_OUTPUT"
          echo "Final verdict: error (environment/configuration problem)."
          exit 2
        fi
        # Priority 2: baseline gate failed.
        if [ "$HAS_COMPARE" = "true" ] && [ "$GATE_CONCLUSION" = "failure" ]; then
          echo "exit-code=1" >> "$GITHUB_OUTPUT"
          echo "Final verdict: gate failed (new findings vs baseline)."
          exit 1
        fi
        # Priority 3: scan findings at or above the fail-on threshold.
        if [ "$SCAN_VERDICT" = "findings" ]; then
          echo "exit-code=1" >> "$GITHUB_OUTPUT"
          echo "Final verdict: findings exist (scan exit $SCAN_EXIT)."
          exit 1
        fi
        # Priority 4: all checks passed.
        echo "exit-code=0" >> "$GITHUB_OUTPUT"
        echo "Final verdict: clean."
        exit 0

    - name: Generate Job Summary
      id: summary
      if: ${{ always() }}
      shell: bash
      env:
        SCAN_VERDICT: ${{ steps.scan.outputs.verdict }}
        SCAN_EXIT: ${{ steps.scan.outputs.scan-exit-code }}
        INSTALL_CONCLUSION: ${{ steps.install.conclusion }}
        HAS_COMPARE: ${{ inputs.compare-with != '' }}
        REPROCASE_REF_RESOLVED: ${{ steps.install.outputs.reprocase-ref-resolved }}
        REPROCASE_COMMIT: ${{ steps.install.outputs.reprocase-commit }}
        REPROCASE_VERSION: ${{ steps.install.outputs.reprocase-version }}
      run: |
        set -uo pipefail
        SUMMARY="$GITHUB_STEP_SUMMARY"
        # Safe header — static content, no user-controlled data.
        echo "## 🔍 ReproCase Scan Report" > "$SUMMARY"
        echo "" >> "$SUMMARY"
        if [ "$INSTALL_CONCLUSION" = "failure" ]; then
          echo "> ⛔ **Installation failed** — ReproCase could not be installed. Check the logs for details." >> "$SUMMARY"
          exit 0
        fi
        echo "| | |" >> "$SUMMARY"
        echo "|---|---|" >> "$SUMMARY"
        echo "| **Target** | \`${{ inputs.url }}\` |" >> "$SUMMARY"
        echo "| **ReproCase version** | $REPROCASE_VERSION (ref: \`$REPROCASE_REF_RESOLVED\`, commit: \`$REPROCASE_COMMIT\`) |" >> "$SUMMARY"
        echo "| **Fail-on threshold** | \`${{ inputs.fail-on }}\` |" >> "$SUMMARY"
        echo "| **Baseline** | ${{ inputs.compare-with || 'none' }} |" >> "$SUMMARY"
        echo "" >> "$SUMMARY"
        # Verdict line
        case "$SCAN_VERDICT" in
          clean)    echo "### ✅ Verdict: clean" >> "$SUMMARY" ;;
          findings) echo "### ⚠️ Verdict: findings detected" >> "$SUMMARY" ;;
          error)    echo "### ⛔ Verdict: scanner error" >> "$SUMMARY" ;;
          *)        echo "### ❓ Verdict: unknown" >> "$SUMMARY" ;;
        esac
        echo "" >> "$SUMMARY"
        if [ "$SCAN_VERDICT" = "error" ]; then
          echo "> The scanner could not run properly. This is an environment or configuration problem, NOT a verdict about your website." >> "$SUMMARY"
          echo "> Run \`reprocase doctor\` to diagnose." >> "$SUMMARY"
          echo "" >> "$SUMMARY"
        fi
        # Findings summary from result.json (if the scan completed)
        if [ -f reprocase-report/result.json ] && [ "$SCAN_VERDICT" != "error" ]; then
          node -e "
            const fs = require('fs');
            const summaryFile = process.env.SUMMARY;
            const r = JSON.parse(fs.readFileSync('reprocase-report/result.json', 'utf8'));
            const s = r.summary;
            const esc = (v) => String(v || '').replace(/\\n/g, ' ').replace(/\\r/g, '');
            const safeText = (v, max) => {
              let s = String(v || '').replace(/[\\n\\r]/g, ' ').trim();
              if (s.length > max) s = s.slice(0, max) + '…';
              return s.replace(/\\\\/g, '/').replace(/[&<>\"\\\`]/g, function(c) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;','\\\`':'&#96;'}[c];
              });
            };
            const obs = r.stats.observationTimeouts || 0;
            const code = r.stats.pagesVisited || 0;
            const act = r.stats.actionsPerformed || 0;
            console.log('| **Pages visited** | ' + code + ' |');
            console.log('| **Interactions** | ' + act + ' |');
            console.log('| **Duration** | ' + Math.round((r.stats.durationMs || 0) / 1000) + 's |');
            console.log('');
            console.log('### Findings');
            console.log('');
            console.log('| Severity | Verified | Suspected |');
            console.log('|----------|----------|-----------|');
            for (const sev of ['critical', 'high', 'medium', 'low']) {
              const v = (r.findings || []).filter(function(f) { return f.severity === sev && f.status === 'verified'; }).length;
              const sus = (r.findings || []).filter(function(f) { return f.severity === sev && f.status === 'suspected'; }).length;
              if (v + sus > 0) console.log('| **' + sev + '** | ' + v + ' | ' + sus + ' |');
            }
            if (s.verified + s.suspected === 0) {
              console.log('');
              console.log('✅ No findings detected.');
            }
            if (obs > 0) {
              console.log('');
              console.log('> ⏳ ' + obs + ' page(s) had continuous async activity and were not fully observed.');
            }
            console.log('');
            console.log('📊 [View full report](./reprocase-report/report.html) (download the artifact to open offline)');
          " 2>> /dev/null >> "$SUMMARY" || true
        fi
        # Compare results (if baseline was provided)
        if [ "$HAS_COMPARE" = "true" ] && [ -f reprocase-report/compare/compare.json ]; then
          echo "" >> "$SUMMARY"
          echo "---" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "### 📊 Changes vs baseline" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('reprocase-report/compare/compare.json', 'utf8'));
            const s = c.summary;
            console.log('| | Count |');
            console.log('|---|---|');
            console.log('| 🆕 New | ' + s.newCount + ' |');
            console.log('| ✅ Resolved' + (s.resolvedUnconfirmedCount > 0 ? ' (' + s.resolvedUnconfirmedCount + ' unconfirmed)' : '') + ' | ' + s.resolvedCount + ' |');
            console.log('| 🔄 Persistent | ' + s.persistentCount + ' |');
            if (c.coverage && c.coverage.coverageShrunk) {
              console.log('');
              console.log('> ⚠️ Coverage shrank: ' + c.coverage.removedPages.length + ' page(s) from the baseline were not revisited.');
            }
          " 2>> /dev/null >> "$SUMMARY" || true
        fi
        # Gate result
        echo "" >> "$SUMMARY"
        echo "---" >> "$SUMMARY"
        echo "" >> "$SUMMARY"
        case "$SCAN_VERDICT" in
          error)
            echo "**Gate result:** ⛔ scanner error (exit 2) — environment problem" >> "$SUMMARY"
            ;;
          findings)
            if [ "$HAS_COMPARE" = "true" ] && [ -f reprocase-report/compare/compare.json ]; then
              CMP_EXIT=$(node -e "
                try { console.log('checked') } catch(e) { console.log('') }
              " 2>/dev/null)
              GATE_CONCL="${{ steps.gate.conclusion }}"
              if [ "$GATE_CONCL" = "failure" ]; then
                echo "**Gate result:** 🔴 Baseline gate FAILED (new findings detected)" >> "$SUMMARY"
              else
                echo "**Gate result:** 🟢 Baseline gate passed" >> "$SUMMARY"
              fi
            else
              echo "**Gate result:** ⚠️ Findings exist at/above threshold (fail-on: \`${{ inputs.fail-on }}\`)" >> "$SUMMARY"
            fi
            ;;
          clean)
            echo "**Gate result:** 🟢 Clean" >> "$SUMMARY"
            ;;
        esac
        echo "" >> "$SUMMARY"
        echo "---" >> "$SUMMARY"
        echo "" >> "$SUMMARY"
        echo "📄 Report artifact: \`${{ inputs.report-name }}\` (contains report.html, result.json, issues.md, generated-tests/)" >> "$SUMMARY"
        echo "🔒 Traces and raw screenshots are not included (private evidence)." >> "$SUMMARY"

    - name: Publish privacy-stripped report
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        if [ -d reprocase-report ]; then
          rm -rf reprocase-report/artifacts/traces
          ls reprocase-report
        fi

    - uses: actions/upload-artifact@v4
      if: ${{ always() && hashFiles('reprocase-report/**') != '' }}
      with:
        name: ${{ inputs.report-name }}
        path: reprocase-report/
        retention-days: 14
