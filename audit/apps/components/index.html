<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Components Lab (shadow DOM + iframes)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f2f8; color: #241b33; }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    .section { background: #fff; border: 1px solid #e0dcef; border-radius: 10px; padding: 12px 16px; margin: 12px 0; }
    iframe { width: 100%; height: 120px; border: 1px solid #d5cfe8; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Components Lab</h1>
    <div class="section">
      <h2>Open shadow DOM</h2>
      <div id="shadow-host"></div>
      <p>The shadow component contains a crashing button and a missing first-party image.</p>
    </div>
    <div class="section">
      <h2>Same-origin iframe</h2>
      <iframe src="./frame-child.html" title="same origin panel"></iframe>
    </div>
    <div class="section">
      <h2>Cross-origin iframe (out of scope)</h2>
      <iframe src="http://127.0.0.1:4641/outside.html" title="cross origin panel"></iframe>
    </div>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var host = document.getElementById('shadow-host');
      var root = host.attachShadow({ mode: 'open' });
      root.innerHTML =
        '<style>button { font: inherit; padding: 6px 12px; }</style>' +
        '<button id="shadow-crash-btn">Recompute shadow metrics</button>' +
        '<img src="./missing-shadow.png" alt="shadow asset" width="140" height="70">' +
        '<p>Shadow content rendered.</p>';
      root.getElementById('shadow-crash-btn').addEventListener('click', function () {
        throw new Error('ShadowBoom: crash inside an open shadow root (component fault)');
      });
    });
  </script>
</body>
</html>
