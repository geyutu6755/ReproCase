<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telemetry (late fault)</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f7f4ef; color: #2b2b2b; }
    main { max-width: 640px; margin: 0 auto; padding: 20px; }
    .card { background: #fff; border: 1px solid #e4ddd2; border-radius: 8px; padding: 12px 16px; margin: 10px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Telemetry</h1>
    <div class="card"><p>Telemetry initializes quietly, then a defect throws
    <b>1000 ms after load</b> — past the fixed 600 ms settle window used before
    v0.3.0, inside the adaptive default window (1500 ms).</p></div>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        throw new Error('LateFault: telemetry init crash 1000ms after load (detection window sample)');
      }, 1000);
    });
  </script>
</body>
</html>
