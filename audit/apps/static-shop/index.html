<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Static Shop</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Verdana, sans-serif; background: #fff; color: #222; }
    header { border-bottom: 2px solid #222; padding: 10px 16px; }
    nav a { margin-right: 14px; color: #222; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .price { font-weight: bold; }
  </style>
</head>
<body>
  <header><strong>Static Shop</strong>
    <nav>
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./contact.html">Contact</a>
      <a href="./promotions.html">Promotions</a>
    </nav>
  </header>
  <main>
    <h1>Welcome</h1>
    <p>A deliberately boring four-page static website: server-rendered HTML, real links,
    one broken product image and one promotions page that does not exist.</p>
    <p><span class="price">$19.00</span> — Handcrafted widget</p>
    <img src="./assets/widget.svg" alt="Widget" width="160" height="80">
    <img src="./assets/widget-photo.png" alt="Widget photo" width="160" height="80">
    <p><a href="./promotions.html">Current promotions</a></p>
  </main>
</body>
</html>
