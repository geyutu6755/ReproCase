<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow Sync — unhandled rejection</title>
  <link rel="stylesheet" href="./audit.css">
</head>
<body>
  <header class="app"><div class="container"><span class="logo">TaskFlow</span>
    <nav><a href="./index.html">Home</a></nav>
  </div></header>
  <div class="container">
    <h1>Sync lab</h1>
    <div class="panel">
      <p>Kicks off an async job that rejects with no handler — must surface as an
      <code>unhandledrejection</code> and be reported as an uncaught JS exception.</p>
      <button id="audit-async" type="button">Start background sync</button>
      <p class="status" id="audit-sync-out"></p>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('audit-async').addEventListener('click', function () {
        Promise.reject(new Error('AuditAsyncBoom: unhandled promise rejection (audit fault)'));
        document.getElementById('audit-sync-out').textContent = 'Sync job dispatched.';
      });
    });
  </script>
</body>
</html>
